name: Sync upstream

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'youngzyl/Jiangtherapee-Super-Resolution-World-Best'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
      - name: Merge upstream without overwriting fork changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/y-g-jiang/Jiangtherapee-Super-Resolution-World-Best.git
          git fetch --no-tags upstream main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo 'Fork already contains upstream main.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if ! git merge --no-edit upstream/main; then
            git merge --abort
            echo 'Upstream conflicts with fork changes. Resolve manually; no changes were pushed.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          git push origin HEAD:main
          echo "Merged upstream main at $(git rev-parse upstream/main)." >> "$GITHUB_STEP_SUMMARY"
